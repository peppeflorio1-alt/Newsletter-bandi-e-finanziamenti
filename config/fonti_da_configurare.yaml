# =========================================================================
# CATALOGO DI 100 FONTI DA ATTIVARE (elenco fornito da Peppe)
# =========================================================================
# Questo file NON viene letto dallo script (main.py legge solo
# config/sources.yaml). E' un elenco di partenza: per ogni fonte che vuoi
# attivare davvero, segui il paragrafo 6 del README (trovare il feed RSS o
# i selettori HTML) e poi SPOSTA quella voce dentro config/sources.yaml,
# nel formato richiesto (tipo, url completo, eventuali selettori).
#
# Nessuno di questi indirizzi e' stato verificato automaticamente: sono
# gli indirizzi base dei siti, non ancora la pagina/il feed specifico dei
# bandi. 'sito' e' il dominio di partenza da cui cercare la sezione bandi.
# =========================================================================

