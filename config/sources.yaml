# =========================================================================
# CONFIGURAZIONE DELLE FONTI
# =========================================================================
# Qui elenchi TUTTI i siti da cui vuoi che la newsletter prenda i bandi.
# Non serve programmare per modificare questo file: e' solo una lista.
#
# Ogni fonte ha questa forma:
#
#   - nome: "Nome che apparira' nella pagina"
#     livello: comune | regione | italia | europa | internazionale
#     area: "Emilia-Romagna"   # SOLO per livello comune/regione: decide in quale
#                               # tab della pagina finisce (una tab per area)
#     tipo: rss   oppure   html   oppure   plone   oppure   wordpress
#     url: "https://..."
#     (se tipo: html, servono anche i "selettori", vedi sotto e il README)
#
# NOTA IMPORTANTE:
# Gli URL RSS qui sotto sono ESEMPI PLAUSIBILI ma NON sono stati verificati
# (io non ho accesso a internet in questa sessione). Prima di lasciare che
# la newsletter giri da sola, apri ciascun link nel browser e controlla che
# funzioni. Il README spiega come trovare il feed RSS giusto per un sito e
# come sostituirlo se quello scritto qui non e' corretto.
# =========================================================================

fonti:
  # ---------------------------------------------------------------------
  # VERIFICATA IL 18/09/2026: questo sito usa Plone (vedi fetch_plone.py).
  # Trovati 67 bandi reali con questa configurazione.
  # ---------------------------------------------------------------------
  - nome: "Regione Emilia-Romagna - Bandi per finanziamenti e contributi"
    livello: regione
    area: "Emilia-Romagna"
    tipo: plone
    url: "https://www.regione.emilia-romagna.it"
    percorso: "/leggi-atti-bandi/bandi-finanziamenti-contributi"
    tipi_contenuto: ["Bando"]

  # ---------------------------------------------------------------------
  # VERIFICATA IL 18/09/2026, con un limite da conoscere: questa e' la
  # sezione tematica "Cultura, Turismo e Sport" del portale, gia' filtrata
  # per argomento. Il sito pero' NON offre un feed dati diretto: leggiamo
  # solo la PRIMA PAGINA di risultati (l'elenco completo usa una modalita'
  # di navigazione che non e' possibile leggere in modo automatico e
  # affidabile). In pratica: i bandi che compaiono in prima pagina sul
  # sito compariranno nella tua newsletter; quelli piu' indietro nelle
  # pagine successive no. Se in futuro vuoi, possiamo rivedere questo
  # limite insieme.
  # ---------------------------------------------------------------------
  - nome: "Regione Lombardia - Bandi (tematica Cultura, Turismo e Sport)"
    livello: regione
    area: "Lombardia"
    tipo: html
    url: "https://www.bandi.regione.lombardia.it/servizi/servizio/catalogo/tematica/cultura-turismo-sport"
    selettori:
      contenitore_elemento: "div.card-wrapper.card-space"
      titolo: ".card-title"
      link: "a.text-decoration-none"
      riassunto: ".card-text"
      scadenza: "input.checkCloseDate"
      scadenza_attributo: "value"
      stato: ".badge"

  # ---------------------------------------------------------------------
  # VERIFICATA IL 18/09/2026: fondazione bancaria, sito WordPress con un
  # archivio dati pulito per i bandi (34 trovati). Manca pero' un dato
  # strutturato di scadenza/stato: la fonte mostra sempre i bandi come
  # aperti, assumendo che la fondazione tolga dall'elenco quelli chiusi
  # (prassi comune, ma non garantita al 100%: vedi fetch_wordpress.py).
  # ---------------------------------------------------------------------
  - nome: "Fondazione Cariplo - Bandi"
    livello: regione
    area: "Lombardia"
    tipo: wordpress
    url: "https://www.fondazionecariplo.it"
    tipo_contenuto: "bando"

  - nome: "Regione Piemonte - Bandi e finanziamenti"
    livello: regione
    area: "Piemonte"
    tipo: rss
    url: "https://www.regione.piemonte.it/web/rss/bandi.xml"
    da_verificare: true

  - nome: "Ministero della Cultura - Avvisi e bandi"
    livello: italia
    tipo: rss
    url: "https://cultura.gov.it/avvisi/feed"
    da_verificare: true

  # ---------------------------------------------------------------------
  # VERIFICATA IL 18/09/2026: stessa piattaforma e stesso limite di
  # Fondazione Cariplo qui sopra (WordPress, niente scadenza strutturata).
  # ---------------------------------------------------------------------
  - nome: "Fondazione Carisbo - Bandi e iniziative"
    livello: regione
    area: "Emilia-Romagna"
    tipo: wordpress
    url: "https://www.fondazionecarisbo.it"
    tipo_contenuto: "bando"

  # ---------------------------------------------------------------------
  # ESEMPIO: fonte di tipo HTML (per siti senza RSS: comuni, alcuni portali
  # regionali, ecc.). Qui servono i "selettori CSS", cioe' le istruzioni
  # che dicono allo script dove guardare nella pagina. Il README spiega
  # come trovarli con pochi click, senza scrivere codice.
  # ---------------------------------------------------------------------
  - nome: "Comune di Grazzanise - Albo bandi (ESEMPIO da configurare)"
    livello: comune
    area: "Campania"
    tipo: html
    url: "https://www.comune.grazzanise.ce.it/bandi-di-gara-e-concorso"
    da_verificare: true
    selettori:
      contenitore_elemento: "div.elenco-bandi article"   # ogni "scheda" di bando
      titolo: "h2 a"                                     # dentro la scheda: il titolo
      link: "h2 a"                                       # dentro la scheda: il link (attributo href)
      data: "time"                                       # dentro la scheda: la data (opzionale)
      riassunto: "p.excerpt"                              # dentro la scheda: descrizione (opzionale)
      scadenza: "span.scadenza"                           # dentro la scheda: la data di scadenza (opzionale)
      # scadenza_attributo: "value"                       # scommenta se la data e' in un attributo invece che nel testo

  # ---------------------------------------------------------------------
  # Funding & Tenders Portal (Unione Europea) - livello europeo.
  # Il portale UE offre una ricerca via web ma l'endpoint API pubblico
  # cambia nel tempo: verificare su
  # https://ec.europa.eu/info/funding-tenders/opportunities/portal/
  # prima di attivare. Lasciato come promemoria/placeholder.
  # ---------------------------------------------------------------------
  # - nome: "EU Funding & Tenders Portal"
  #   livello: europa
  #   tipo: html
  #   url: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-proposals"
  #   da_verificare: true
  #   selettori:
  #     contenitore_elemento: ".eui-card"
  #     titolo: ".eui-card-header-title"
  #     link: "a"
  #     data: ".eui-u-text-annotation"

# =========================================================================
# PAROLE CHIAVE PER IL FILTRO
# =========================================================================
# Un bando viene incluso nella newsletter solo se il suo titolo o la sua
# descrizione contengono ALMENO UNA di queste parole (non maiuscole/minuscole,
# non serve mettere accenti in piu' varianti, lo script normalizza da solo).
# Aggiungi o togli parole liberamente, una per riga.
# =========================================================================

parole_chiave:
  - cultura
  - culturale
  - culturali
  - arte
  - artistico
  - spettacolo
  - teatro
  - musica
  - patrimonio
  - partecipazione
  - partecipativo
  - cittadinanza attiva
  - democrazia
  - democratico
  - inclusione
  - giovani
  - giovanile
  - sociale
  - terzo settore
  - associazionismo
  - volontariato
  - ristrutturazione
  - riqualificazione
  - recupero
  - immobile
  - immobili
  - sede
  - sale
  - sala
  - centro di aggregazione
  - spazi
  - edilizia

# =========================================================================
# ALTRE IMPOSTAZIONI
# =========================================================================
impostazioni:
  giorni_di_permanenza: 60   # dopo quanti giorni un bando sparisce dalla pagina se non ricompare nella fonte
  titolo_pagina: "Bandi e finanziamenti - Newsletter di Peppe"
