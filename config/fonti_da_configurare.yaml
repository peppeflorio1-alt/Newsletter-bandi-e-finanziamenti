# CATALOGO DI 100 FONTI DA ATTIVARE (elenco fornito da Peppe, indirizzi con
# protocollo https:// normalizzato il 18/09/2026)
# =========================================================================
# Questo file NON viene letto dallo script (main.py legge solo
# config/sources.yaml). E' un elenco di partenza: per ogni fonte che vuoi
# attivare davvero, segui il paragrafo 6 del README (trovare il feed RSS,
# l'archivio dati o i selettori HTML) e poi SPOSTA quella voce dentro
# config/sources.yaml, nel formato richiesto.
#
# 'sito' e' l'indirizzo base del sito (gia' con https://): non e' ancora
# la pagina/il feed specifico dei bandi, che va cercato dentro il sito.
# =========================================================================

